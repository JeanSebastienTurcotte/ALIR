<span class="type">Définition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.1.36</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Multiplication d’une matrice par un scalaire.</span>
</h2>
<div class="para logical">
<div class="para">Soit <span class="process-math">\(A\in \mathcal{m\times n}\)</span> et <span class="process-math">\(k\in \R\text{.}\)</span> La matrice <span class="process-math">\(kA\)</span> est définie comme étant la matrice telle que</div>
<div class="displaymath process-math">

(kA)_{i,j}=(ka_{i,j})\text{.}
\end{equation*}
</div>
