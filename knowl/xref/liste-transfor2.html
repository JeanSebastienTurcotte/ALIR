<figure class="list table-like"><figcaption><span class="type">Liste</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.1.15<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Des transformations linéaires<div class="autopermalink" data-description="Liste 2.1.15: Des transformations linéaires"><a href="#liste-transfor2" title="Copy heading and permalink for Liste 2.1.15: Des transformations linéaires" aria-label="Copy heading and permalink for Liste 2.1.15: Des transformations linéaires">🔗</a></div></figcaption><div class="named-list-content"><ol class="decimal" id="liste-transfor2-2">
<li>
<div class="para">La transformation <span class="process-math">\(I(x,y)=(x,y)\text{,}\)</span> transformation qui laisse chaque vecteur en place. On l’appelle la transformation identité.<details class="ptx-footnote" aria-live="polite" id="li-transfor2-I-1-2"><summary class="ptx-footnote__number" title="Note de bas de page 2.1.2"><sup> 2 </sup></summary><div class="ptx-footnote__contents" id="li-transfor2-I-1-2">Le choix du mot identité deviendra évident une fois qu’on aura introduit la composition de deux transformations linéaires, qui sera une sorte de produit, à la section <a href="sec-prodmat.html" class="internal" title="Section 2.2: La composition et le produit matriciel">2.2</a>
</div></details><div class="autopermalink" data-description="Paragraphe"><a href="#li-transfor2-I-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="autopermalink" data-description="Point 2.1.15:1"><a href="#li-transfor2-I" title="Copy heading and permalink for Point 2.1.15:1" aria-label="Copy heading and permalink for Point 2.1.15:1">🔗</a></div>
</li>
<li>
<div class="para">La réflexion par rapport à l’axe des abscisses, donnée par la transformation <span class="process-math">\(S_x(x,y)=(x,-y)\text{.}\)</span><div class="autopermalink" data-description="Paragraphe"><a href="#li-transfor2-refx-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="autopermalink" data-description="Point 2.1.15:2"><a href="#li-transfor2-refx" title="Copy heading and permalink for Point 2.1.15:2" aria-label="Copy heading and permalink for Point 2.1.15:2">🔗</a></div>
</li>
<li>
<div class="para">La rotation de <span class="process-math">\(90^\circ\)</span> ou <span class="process-math">\(\frac{\pi}{2}\)</span> dans le sens antihoraire, donnée par la transformation <span class="process-math">\(R_{\frac{\pi}{2}}(x,y)=(-y,x)\text{.}\)</span><div class="autopermalink" data-description="Paragraphe"><a href="#li-transfor2-rot90-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="autopermalink" data-description="Point 2.1.15:3"><a href="#li-transfor2-rot90" title="Copy heading and permalink for Point 2.1.15:3" aria-label="Copy heading and permalink for Point 2.1.15:3">🔗</a></div>
</li>
<li>
<div class="para">Un étirement horizontal de facteur <span class="process-math">\(r\in\R\)</span> est une transformation linéaire donnée par <span class="process-math">\(Eh_r(x,y)=(rx,y)\text{.}\)</span><div class="autopermalink" data-description="Paragraphe"><a href="#li-transfor2-Ehr-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="para">De même, un étirement vertical est donné par <span class="process-math">\(Ev_r(x,y)=(x,ry)\text{.}\)</span><div class="autopermalink" data-description="Paragraphe"><a href="#li-transfor2-Ehr-2" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="autopermalink" data-description="Point 2.1.15:4"><a href="#li-transfor2-Ehr" title="Copy heading and permalink for Point 2.1.15:4" aria-label="Copy heading and permalink for Point 2.1.15:4">🔗</a></div>
</li>
<li>
<div class="para">Une homothétie est une transformation qui multiplie chaque composante d’un vecteur par un facteur <span class="process-math">\(r\in\R\text{.}\)</span> Elle est donnée par la transformation <span class="process-math">\(H_r(x,y)=(rx,ry)\text{.}\)</span><div class="autopermalink" data-description="Paragraphe"><a href="#li-transfor2-homothetie-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="autopermalink" data-description="Point 2.1.15:5"><a href="#li-transfor2-homothetie" title="Copy heading and permalink for Point 2.1.15:5" aria-label="Copy heading and permalink for Point 2.1.15:5">🔗</a></div>
</li>
<li>
<div class="para">Une matrice de permutation est une matrice qui change l’ordre des composantes du vecteur. Dans <span class="process-math">\(\R^2\text{,}\)</span> la seule transformation qui accomplit une telle permutation est <span class="process-math">\(P(x,y)=(y,x)\text{,}\)</span> bien que l’identité est aussi vue comme une matrice de permutation.<div class="autopermalink" data-description="Paragraphe"><a href="#li-transfor2-P-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="autopermalink" data-description="Point 2.1.15:6"><a href="#li-transfor2-P" title="Copy heading and permalink for Point 2.1.15:6" aria-label="Copy heading and permalink for Point 2.1.15:6">🔗</a></div>
</li>
<li>
<div class="para">Soit <span class="process-math">\(\vec{w}\)</span> un vecteur non nul. La projection orthogonale sur <span class="process-math">\(\vec{w}\)</span> est une transformation linéaire.<div class="autopermalink" data-description="Paragraphe"><a href="#li-transfor2-proj-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="autopermalink" data-description="Point 2.1.15:7"><a href="#li-transfor2-proj" title="Copy heading and permalink for Point 2.1.15:7" aria-label="Copy heading and permalink for Point 2.1.15:7">🔗</a></div>
</li>
</ol></div></figure><span class="incontext"><a class="internal" href="sec-transfodef.html#liste-transfor2">Contexte</a></span>
