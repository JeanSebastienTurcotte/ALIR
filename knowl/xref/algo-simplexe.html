<article class="algorithm theorem-like"><h4 class="heading">
<span class="type">Algorithme</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">7.2.19</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">La méthode du simplexe.</span>
</h4>
<div class="para">On considère un problème de programmation linéaire sous forme canonique et <span class="process-math">\(S\text{,}\)</span> sa matrice initiale du simplexe. Pour trouver le maximum de la fonction objectif, on suit la procédure suivante.<div class="autopermalink" data-description="Paragraphe"><a href="#algo-simplexe-2-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div> <figure class="list table-like"><figcaption><span class="type">Liste</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">7.2.20<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>L’algorithme du simplexe<div class="autopermalink" data-description="Liste 7.2.20: L’algorithme du simplexe"><a href="#li-simplexe" title="Copy heading and permalink for Liste 7.2.20: L’algorithme du simplexe" aria-label="Copy heading and permalink for Liste 7.2.20: L’algorithme du simplexe">🔗</a></div></figcaption><div class="named-list-content"><ol class="decimal" id="li-simplexe-2">
<li>
<div class="para">Regarder la dernière ligne de la matrice du simplexe. Si toutes les entrées correspondant aux variables des contraintes et aux variables d’écart sont positives, la solution est optimale et l’algorithme est terminé. En cas de présence de valeurs négatives, sélectionner la colonne de la variable dont l’entrée de la dernière ligne est la plus petite (négative) pour effectuer le pivotage.<div class="autopermalink" data-description="Paragraphe"><a href="#li-simplexepivotcolonne-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="autopermalink" data-description="Point 7.2.20:1"><a href="#li-simplexepivotcolonne" title="Copy heading and permalink for Point 7.2.20:1" aria-label="Copy heading and permalink for Point 7.2.20:1">🔗</a></div>
</li>
<li>
<div class="para">Pour chaque entrée positive de la colonne choisie, calculer le rapport entre l’entrée de la dernière colonne et celle de la colonne choisie. La ligne où ce rapport est le plus petit est la ligne de pivot.<div class="autopermalink" data-description="Paragraphe"><a href="#li-simplexepivotligne-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="autopermalink" data-description="Point 7.2.20:2"><a href="#li-simplexepivotligne" title="Copy heading and permalink for Point 7.2.20:2" aria-label="Copy heading and permalink for Point 7.2.20:2">🔗</a></div>
</li>
<li>
<div class="para">Effectuer le pivotage en rendant chaque élément de la colonne pivot égal à zéro, hormis ce pivot. La matrice offre maintenant une nouvelle solution de base admissible pour le problème.<div class="autopermalink" data-description="Paragraphe"><a href="#li-simplexe-2-3-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="autopermalink" data-description="Point 7.2.20:3"><a href="#li-simplexe-2-3" title="Copy heading and permalink for Point 7.2.20:3" aria-label="Copy heading and permalink for Point 7.2.20:3">🔗</a></div>
</li>
<li>
<div class="para">Répéter les étapes ci-dessus jusqu’à ce que toutes les entrées de la dernière ligne soient positives.<div class="autopermalink" data-description="Paragraphe"><a href="#li-simplexe-2-4-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="autopermalink" data-description="Point 7.2.20:4"><a href="#li-simplexe-2-4" title="Copy heading and permalink for Point 7.2.20:4" aria-label="Copy heading and permalink for Point 7.2.20:4">🔗</a></div>
</li>
</ol></div></figure><div class="autopermalink" data-description="Algorithme 7.2.19: La méthode du simplexe"><a href="#algo-simplexe" title="Copy heading and permalink for Algorithme 7.2.19: La méthode du simplexe" aria-label="Copy heading and permalink for Algorithme 7.2.19: La méthode du simplexe">🔗</a></div></article><span class="incontext"><a class="internal" href="sec-simplexe.html#algo-simplexe">Contexte</a></span>
