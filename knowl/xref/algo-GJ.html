<div class="para logical">
<div class="para">Si <span class="process-math">\(i\)</span> n’est pas encore défini, on pose <span class="process-math">\(i=1\text{.}\)</span> Si <span class="process-math">\(i=m\text{,}\)</span> on saute à l’étape suivante. Sinon, si <span class="process-math">\(i&lt;m\text{,}\)</span> on augmente <span class="process-math">\(i\)</span> de <span class="process-math">\(1\text{.}\)</span>
</div>
<ol class="lower-alpha" style="list-style: ptx-marker-0;" id="li-GJpivdown-1-7">
<li>
<div class="para">Si possible, échanger la ligne <span class="process-math">\(i\)</span> avec une autre ligne (<span class="process-math">\(j&gt;i\)</span>) de manière à avoir un pivot non nul dans la colonne la plus à gauche possible.<div class="autopermalink" aria-hidden="true" data-description="Paragraphe"><a tabindex="-1" href="#li-GJpivdown-1-7-1-1" title="Copier le titre et le lien permanent pour Paragraphe" aria-label="Copier le titre et le lien permanent pour Paragraphe">🔗</a></div>

</li>
<li>
<div class="para">Si nécessaire, multiplier la nouvelle ligne <span class="process-math">\(i\)</span> par la constante appropriée pour avoir son pivot égal à <span class="process-math">\(1\text{.}\)</span><div class="autopermalink" aria-hidden="true" data-description="Paragraphe"><a tabindex="-1" href="#li-GJpiv1-1" title="Copier le titre et le lien permanent pour Paragraphe" aria-label="Copier le titre et le lien permanent pour Paragraphe">🔗</a></div>
