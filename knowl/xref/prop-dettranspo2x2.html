<article class="proposition theorem-like"><h2 class="heading">
<span class="type">Proposition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">4.1.23</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Le déterminant de la transposée d’une matrice <span class="process-math">\(2\times 2\)</span>.</span>
</h2>
<div class="para logical">
<div class="para">Soit <span class="process-math">\(A\text{,}\)</span> une matrice <span class="process-math">\(2\times 2\)</span> et <span class="process-math">\(A^T\text{,}\)</span> sa <a href="sec-transposee.html#def-transposee" class="xref" data-knowl="./knowl/xref/def-transposee.html" data-reveal-label="Dévoiler" data-close-label="Fermer" title="Définition 3.4.1">transposée</a>. Alors</div>
<div class="displaymath process-math" data-contains-math-knowls="./knowl/xref/def-transposee.html">
\begin{equation*}
\det(A^T)=\det(A)\text{.}
\end{equation*}
</div>
