<article class="definition definition-like"><h2 class="heading">
<span class="type">Définition</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">2.1.34</span><span class="period heading-divison-mark heading-divison-mark__period">.</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="title">Somme de deux matrices.</span>
</h2>
<div class="para logical">
<div class="para">Soit <span class="process-math">\(A,B\in\mathcal{M}_{m\times n}\)</span> deux matrices. On définit la somme de <span class="process-math">\(A\)</span> et <span class="process-math">\(B\)</span> comme étant la matrice telle que</div>
<div class="displaymath process-math">
\begin{equation*}
(A+B)_{i,j}=(a_{i,j}+b_{i,j})\text{.}
\end{equation*}
</div>
