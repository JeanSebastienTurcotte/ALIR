</h4>
<div class="para">Soit <span class="process-math">\(W\text{,}\)</span> un espace vectoriel. On dit que <span class="process-math">\(V\neq \emptyset\)</span> est un sous-espace vectoriel de <span class="process-math">\(W\)</span> si les vecteurs dans <span class="process-math">\(V\)</span> satisfont les propriétés suivantes:<div class="autopermalink" data-description="Paragraphe"><a href="#def-ssesp2-2-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div> <figure class="list table-like"><figcaption><span class="type">Liste</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">5.4.5<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Sous-espace vectoriel<div class="autopermalink" data-description="Liste 5.4.5: Sous-espace vectoriel"><a href="#li-ssesp2" title="Copy heading and permalink for Liste 5.4.5: Sous-espace vectoriel" aria-label="Copy heading and permalink for Liste 5.4.5: Sous-espace vectoriel">🔗</a></div></figcaption><div class="named-list-content"><ol class="decimal" id="li-ssesp2-2">
<li>
<div class="para">Si deux vecteurs sont dans <span class="process-math">\(V\text{,}\)</span> alors leur somme est aussi dans <span class="process-math">\(V\text{,}\)</span> c’est-à-dire si <span class="process-math">\(\vec{u},\vec{v}\in V\text{,}\)</span> alors <span class="process-math">\(\vec{u}+\vec{v}\in V\text{.}\)</span><div class="autopermalink" data-description="Paragraphe"><a href="#li-ssespsomme2-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>
<div class="autopermalink" data-description="Point 5.4.5:1"><a href="#li-ssespsomme2" title="Copy heading and permalink for Point 5.4.5:1" aria-label="Copy heading and permalink for Point 5.4.5:1">🔗</a></div>
</li>
<li>
<div class="para">Si un vecteur est dans <span class="process-math">\(V\)</span> et qu’on le multiplie par un scalaire, alors le multiple est aussi dans <span class="process-math">\(V\text{,}\)</span> c’est-à-dire si <span class="process-math">\(k\in \R,\vec{v}\in V\text{,}\)</span> alors <span class="process-math">\(k\vec{v}\in V\text{.}\)</span><div class="autopermalink" data-description="Paragraphe"><a href="#li-ssespmult2-1" title="Copy heading and permalink for Paragraphe" aria-label="Copy heading and permalink for Paragraphe">🔗</a></div>
</div>

</li>
</ol></div></figure><div class="autopermalink" data-description="Définition 5.4.4: Sous-espace vectoriel"><a href="#def-ssesp2" title="Copy heading and permalink for Définition 5.4.4: Sous-espace vectoriel" aria-label="Copy heading and permalink for Définition 5.4.4: Sous-espace vectoriel">🔗</a></div></article><span class="incontext"><a class="internal" href="sec-espaces.html#def-ssesp2">Contexte</a></span>
